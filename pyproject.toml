[project]
name = "warroom-workspace"
version = "0.1.0"
description = "War Room platform — super-app (crypto / IDX / forex / Polymarket / GMGN / Sistem & AI)"
requires-python = ">=3.12"
# Root menarik seluruh anggota supaya `uv sync` tunggal menyiapkan env dev lengkap.
dependencies = [
    "warroom-core",
    "warroom-api",
    "warroom-worker",
    "warroom-notifier",
    "live-trading",
]

# Root adalah virtual workspace (tidak dipaketkan); anggota di packages/* dan services/*.
[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "services/*"]
# tg-engine ikut workspace sejak 5 Nov 2026: kredensial Telegram sudah dipindah ke
# /etc/warroom/tg-engine.env, jadi sumbernya bisa di-commit dan diuji. Modulnya
# datar (package = false), hanya berbagi lockfile + lint/test.

[tool.uv.sources]
warroom-core = { workspace = true }
warroom-api = { workspace = true }
warroom-worker = { workspace = true }
warroom-notifier = { workspace = true }
# F3 (4 Okt 2026): live-trading kini ANGGOTA WORKSPACE — kode domain ada di dalam repo ini
# (packages/live-trading/), bukan lagi path ke ../live-trading. State runtime tetap di
# /home/admin/live-trading lewat WARROOM_DOMAIN_HOME sampai cutover diputuskan owner.
live-trading = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.7,<1",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "autopep8>=2.3.2",
]

[tool.ruff]
line-length = 110
target-version = "py312"
# vendor/ + crypto/ = kode warisan Tencent. idx616/ kini IKUT lint (14 Okt 2026) —
# sebelumnya dikecualikan dan menyembunyikan bug nyata (F821 `SCALP_TIMEOUT` yang tak
# pernah terdefinisi di grader intraday). 137 format legacy sudah dirapikan.
# vendor/ & crypto/ tetap dikecualikan (kode warisan, di luar cakupan). .venv-merge = env uji F3.
extend-exclude = [
    ".venv",
    ".venv-merge",
    "apps/web",
    # tg-engine: app mandiri hasil lebur 4 Nov 2026. Sejak 5 Nov 2026 ikut lint
    # (52 temuan gaya dibereskan; E501 dashboard HTML dikecualikan di
    # per-file-ignores). Perilaku belum diuji ulang — jangan deploy tanpa uji.
    # "services/tg-engine",
    "node_modules",
    "packages/live-trading/vendor",
    "packages/live-trading/crypto",
    "ops/vulture-whitelist.py",  # whitelist vulture: nama memang "tak terdefinisi" (F821)
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Migrasi Alembic di-generate mesin: baris panjang & urutan impor tak terhindarkan.
[tool.ruff.lint.per-file-ignores]
"packages/core/alembic/versions/*.py" = ["E501", "I001", "UP007", "UP035"]
# Dashboard HTML di-embed sebagai satu string panjang; membungkus atribut HTML
# hanya menambah baris tanpa manfaat keterbacaan.
"services/tg-engine/api.py" = ["E501"]

[tool.pytest.ini_options]
# F3: repo gabungan punya dua tests/ bernama sama (test_config.py). Mode importlib
# membuat pytest memakai path modul, bukan basename — tidak ada tabrakan lagi.
addopts = "-q --import-mode=importlib"
testpaths = ["packages", "services"]
