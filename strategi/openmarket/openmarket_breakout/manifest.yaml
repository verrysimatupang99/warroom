# Manifest strategi — Breakout Donchian (OpenMarket 40+ venue)
#
# Dijalankan mesin Python. Datanya lewat OpenMarketProvider (satu API ->
# Binance/Bybit/OKX/Hyperliquid/Coinbase dkk). Butuh OPENMARKET_API_KEY di env.

id: openmarket_breakout
nama: Breakout Donchian (OpenMarket 40+ venue)
market: openmarket
venue: okx
instrument: [BTC, ETH, SOL, BNB, XRP]
executor: python-engine
status: draft
owner: owner
repo_ref: "warroom/strategi (mesin sendiri)"
publish: api

versi: "1.0"
waktu: 1h
simbol: [BTC, ETH, SOL, BNB, XRP]

# Simbol pakai nama coin (BTC, bukan BTCUSDT) karena OpenMarketProvider._coin()
# menormalkan keduanya. Butuh OPENMARKET_API_KEY di env (lihat jumpstart).

variabel:
  ema_tren: EMA(200)
  atr: ATR(14)
  breakout_atas: HIGHEST(48)     # tertinggi 48 jam (2 hari)
  breakout_bawah: LOWEST(48)

filter:
  - "atr > 0"

# Breakout ke atas di atas tren naik.
entry_long:
  - "close > breakout_atas"
  - "close > ema_tren"

# Breakout ke bawah di bawah tren turun.
entry_short:
  - "close < breakout_bawah"
  - "close < ema_tren"

exit:
  sl_atr: 2.0
  tp_rrr: 3.0

risiko:
  risiko_per_trade_pct: 1.0
