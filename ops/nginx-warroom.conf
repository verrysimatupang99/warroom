# War Room — vhost nginx PRODUKSI untuk 0xgunsl1ng3r.xyz.
# Salinan dari /etc/nginx/sites-available/warroom (sumber berjalan). Baris TLS ditulis
# oleh certbot (jangan diedit manual); menerapkan ulang:
#   sudo install -m 644 ops/nginx-warroom.conf /etc/nginx/sites-available/warroom
#   sudo certbot --nginx -d 0xgunsl1ng3r.xyz --redirect
#   sudo nginx -t && sudo systemctl reload nginx
#
# Catatan: host ini memakai NGINX (bukan Caddy) karena nginx sudah memegang 80/443
# untuk situs lain. ops/Caddyfile tetap disimpan sebagai alternatif untuk host bersih.

# War Room — 0xgunsl1ng3r.xyz (apex) → SvelteKit :3100 + API :8800.
# TLS dikelola CERTBOT (plugin nginx); jangan edit manual blok ssl di bawah.
# Autentikasi ada di APLIKASI (cookie sesi HttpOnly + RBAC), bukan basic-auth di proxy.
# /metrics sengaja TIDAK diekspos ke publik (hanya localhost) — berisi nama job & hitungan.

server {
    server_name 0xgunsl1ng3r.xyz;

    client_max_body_size 2m;

    # API + SSE. proxy_buffering off wajib: tanpa itu /api/v1/stream menggantung
    # (klien melihat "menyambung" selamanya walau server mengirim data).
    location /api/ {
        proxy_pass http://127.0.0.1:8800;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Sisa permintaan → web (SvelteKit adapter-node).
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/0xgunsl1ng3r.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/0xgunsl1ng3r.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # Header keamanan (TLS aktif; cookie sesi sudah Secure dari aplikasi).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

}


server {
    if ($host = 0xgunsl1ng3r.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name 0xgunsl1ng3r.xyz;
    return 404; # managed by Certbot


}