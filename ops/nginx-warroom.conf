# War Room — 0xgunsl1ng3r.xyz (apex) → SvelteKit :3100 + API :8800.
# TLS dikelola certbot (plugin nginx); jangan edit manual blok ssl di bawah.
# Autentikasi ada di APLIKASI (cookie sesi HttpOnly + RBAC), bukan basic-auth di proxy.
# /metrics sengaja TIDAK diekspos ke publik (hanya localhost) — berisi nama job & hitungan.

server {
    server_name 0xgunsl1ng3r.xyz;

    client_max_body_size 2m;

    # API + SSE. proxy_buffering off wajib: tanpa itu /api/v1/stream menggantung
    # (klien melihat "menyambung" selamanya walau server mengirim data).
    location /api/ {
        proxy_pass http://127.0.0.1:8800;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Pratinjau opsi tampilan (statis) — HANYA berkas dari docs/, tanpa daftar direktori.
    location = /pratinjau {
        return 302 /pratinjau/opsi-tampilan.html;
    }
    location ^~ /pratinjau/ {
        alias /srv/pratinjau/;
        autoindex off;
        try_files $uri =404;
    }

    # Sisa permintaan → web (SvelteKit adapter-node).
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/0xgunsl1ng3r.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/0xgunsl1ng3r.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # Header keamanan (TLS aktif; cookie sesi sudah Secure dari aplikasi).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # --- HARDENING (temuan QA eksternal 7 Okt 2026) ---------------------------------
    # CSP dimulai sebagai REPORT-ONLY: pelanggaran dilaporkan, tidak memblokir apa pun,
    # sehingga tidak ada risiko mematikan UI yang sudah jalan. Setelah log bersih,
    # baris ini boleh diganti menjadi `Content-Security-Policy` (enforce) — keputusan manusia.
    # 'unsafe-inline' pada style masih dibutuhkan Svelte (style di dalam komponen);
    # script TIDAK diberi unsafe-inline.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

}


server {
    if ($host = 0xgunsl1ng3r.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name 0xgunsl1ng3r.xyz;
    return 404; # managed by Certbot


}