name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Bukti otomatis harian (TODO 2 Nov #2): jalur paper diuji end-to-end tiap hari,
  # bukan hanya saat ada push. Hasilnya diunggah sebagai artefak.
  schedule:
    - cron: "17 21 * * *"   # 04:17 WIB (21:17 UTC)
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  # Jaring pengaman domain: tes packages/live-trading harus hijau (dulu repo luar
  # verrysimatupang99/live-trading, kini PRIVATE + 404 di runner — F3: domain sudah
  # ANGGOTA WORKSPACE di packages/live-trading/).
  domain:
    name: domain (packages/live-trading) — ruff + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check packages/live-trading/src packages/live-trading/tests
      - run: uv run pytest packages/live-trading -q

  # Platform: workspace tunggal — domain sudah di dalam repo (packages/live-trading,
  # ADR-002/F3). Tidak checkout repo luar lagi.
  platform:
    name: platform (warroom) — sync + ruff + import domain
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Postgres service: tes ber-DB & cek head alembic tidak lagi di-skip diam-diam.
    # check-db-head pakai WARROOM_DB_URL (skema produksi/alembic), pytest pakai
    # WARROOM_TEST_DB_URL (conftest.py) — keduanya menunjuk DB sementara yang sama.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: warroom
          POSTGRES_PASSWORD: warroom
          POSTGRES_DB: warroom_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U warroom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      WARROOM_DB_URL: postgresql+psycopg://warroom:warroom@127.0.0.1:5432/warroom_ci
      WARROOM_TEST_DB_URL: postgresql+psycopg://warroom:warroom@127.0.0.1:5432/warroom_test
      CHECK_DB_HEAD_REQUIRED: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: uv sync (workspace + domain editable)
        run: uv sync --frozen
      - name: ruff
        run: uv run ruff check .
      - name: bukti domain bisa diimpor dari platform
        run: uv run python -c "import live_trading, warroom_core; print(live_trading.__version__, warroom_core.paths())"
      - name: OpenAPI contract tidak drift
        run: uv run python ops/check-openapi-contract.py
      - name: Anggaran baris per berkas (cegah file raksasa)
        run: uv run python ops/check-file-size.py
      - name: Skema DB di head alembic (wajib DB — cek tidak boleh di-skip diam-diam)
        # DB service CI kosong (ephemeral) — upgrade ke head dulu, lalu pastikan di head.
        run: uv run python ops/check-db-head.py --upgrade
      # DB service CI hanya membuat POSTGRES_DB (warroom_ci); pytest butuh
      # DB terpisah "warroom_test" (kontrak conftest/test_url_bukan_produksi).
      - name: Siapkan DB tes (warroom_test)
        run: |
          PGPASSWORD=warroom psql -h 127.0.0.1 -U warroom -d warroom_ci \
            -c "CREATE DATABASE warroom_test OWNER warroom" \
            -c "REVOKE ALL ON DATABASE warroom_test FROM PUBLIC"
      # Tes platform (api/worker/core) ikut CI dengan Postgres service di atas.
      # conftest.py pakai WARROOM_TEST_DB_URL (job-level env).
      - name: pytest platform
        run: uv run pytest -q

  # Kredensial tidak boleh masuk repo (00-ringkasan.md §3 butir 7).

  # Deteksi kode mati Python (padanan knip di job web): whitelist di
  # ops/vulture-whitelist.py — fixture pytest & param interface yang memang tak dipakai.
  hygiene:
    name: hygiene — vulture (kode mati Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uvx vulture packages/core/src packages/live-trading/src services tools ops/vulture-whitelist.py --min-confidence 90

  # Kredensial tidak boleh masuk repo (00-ringkasan.md §3 butir 7).
  secrets:
    name: secrets — gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (git history)
        run: |
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          # SHA256 official (gitleaks checksums.txt) — binary tidak boleh ditukar MITM.
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git . --redact --no-banner --verbose

  # "build web kosong" (P0-T2) — kerangka SvelteKit; UI penuh menyusul di P2.
  web:
    name: web — npm ci + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: lint token (tak ada hex/ukuran hardcoded di komponen)
        run: node scripts/lint-tokens.mjs src
      - run: npm run check
      - run: npm run test
      - name: knip (tak ada berkas/dependensi mati)
        run: npm run knip
      - run: npm run build

  # TODO 2 Nov #2 - bukti otomatis jalur paper: order paper, dedup, kill switch,
  # rem rugi harian, data basi, fail-closed policy kosong. Laporan JSON diunggah
  # sebagai artefak supaya "sehat" bisa diperiksa, bukan diklaim.
  paper-smoke:
    name: paper - smoke end-to-end (laporan artefak)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: jalankan smoke jalur paper
        run: uv run python ops/paper-smoke.py -o paper-smoke-report.json
      - name: unggah laporan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-smoke-report
          path: paper-smoke-report.json
          if-no-files-found: error
          retention-days: 30

  # TODO 2 Nov #6 - e2e Playwright terhadap stack LOKAL (vite preview + API + Postgres
  # di job ini), bukan produksi. Kredensial e2e disemai ke DB sementara, jadi suite
  # ber-sesi pun ikut berjalan. Laporan + trace diunggah sebagai artefak.
  e2e:
    name: e2e - Playwright (stack lokal)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: warroom
          POSTGRES_PASSWORD: warroom
          POSTGRES_DB: warroom_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U warroom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WARROOM_DB_URL: postgresql+psycopg://warroom:warroom@127.0.0.1:5432/warroom_ci
      WARROOM_E2E_USER: uji-web
      # Sandi hanya untuk DB sementara di job ini; tidak pernah dipakai di produksi.
      WARROOM_E2E_PASS: ci-e2e-bukan-rahasia
      WARROOM_E2E_BASE: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: siapkan skema DB
        run: uv sync --frozen && uv run python ops/check-db-head.py --upgrade

      - name: semai user e2e
        run: uv run python ops/e2e-seed-user.py --username "$WARROOM_E2E_USER"

      - name: jalankan API
        run: |
          uv sync --frozen --all-packages
          uv run uvicorn warroom_api.app:app --host 127.0.0.1 --port 8800 &
          # Kesiapan = server MENJAWAB, bukan status 2xx: endpoint /api/v1/* memang
          # butuh sesi (401), jadi memakai `curl -f` akan menunggu selamanya.
          for i in $(seq 1 40); do
            kode=$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 http://127.0.0.1:8800/metrics || true)
            if [ "$kode" != "000" ] && [ -n "$kode" ]; then
              echo "API siap (GET /metrics -> $kode)"
              exit 0
            fi
            sleep 2
          done
          echo "API tidak menjawab dalam 80 detik" >&2
          exit 1

      - name: pasang web + browser Playwright
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build

      - name: jalankan suite e2e
        working-directory: apps/web
        run: |
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173 >/dev/null && break
            sleep 1
          done
          npx playwright test --reporter=list,html

      - name: unggah laporan Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: warn
          retention-days: 14
