name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  # Jaring pengaman domain: tes packages/live-trading harus hijau (dulu repo luar
  # verrysimatupang99/live-trading, kini PRIVATE + 404 di runner — F3: domain sudah
  # ANGGOTA WORKSPACE di packages/live-trading/).
  domain:
    name: domain (packages/live-trading) — ruff + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check packages/live-trading/src packages/live-trading/tests
      - run: uv run pytest packages/live-trading -q

  # Platform: workspace tunggal — domain sudah di dalam repo (packages/live-trading,
  # ADR-002/F3). Tidak checkout repo luar lagi.
  platform:
    name: platform (warroom) — sync + ruff + import domain
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: uv sync (workspace + domain editable)
        run: uv sync --frozen
      - name: ruff
        run: uv run ruff check .
      - name: bukti domain bisa diimpor dari platform
        run: uv run python -c "import live_trading, warroom_core; print(live_trading.__version__, warroom_core.paths())"
      - name: OpenAPI contract tidak drift
        run: uv run python ops/check-openapi-contract.py
      # R5: tes platform (api/worker/core) kini ikut CI. Tes ber-DB **di-skip** dengan
      # alasan jelas bila WARROOM_TEST_DB_URL tidak ada (lihat conftest.py) — jadi job ini
      # tetap hijau tanpa Postgres, dan tidak pernah berpura-pura lulus.
      - name: pytest platform (tes ber-DB di-skip tanpa WARROOM_TEST_DB_URL)
        run: uv run pytest -q

  # Kredensial tidak boleh masuk repo (00-ringkasan.md §3 butir 7).
  secrets:
    name: secrets — gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (git history)
        run: |
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git . --redact --no-banner --verbose

  # "build web kosong" (P0-T2) — kerangka SvelteKit; UI penuh menyusul di P2.
  web:
    name: web — npm ci + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: lint token (tak ada hex/ukuran hardcoded di komponen)
        run: node scripts/lint-tokens.mjs src
      - run: npm run check
      - run: npm run test
      - name: knip (tak ada berkas/dependensi mati)
        run: npm run knip
      - run: npm run build