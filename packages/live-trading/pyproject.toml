[project]
name = "live-trading"
version = "0.1.0"
description = "Multi-market signal + execution stack (crypto / IDX / forex) — War Room"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1,<1",
    "curl_cffi>=0.7,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "openpyxl>=3.1,<4",
    "matplotlib>=3.9,<4",
    "numpy>=2.1,<3",
    "structlog>=24.4,<26",
    "apscheduler>=3.10,<4",
    "websockets>=13,<16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6,<8",
    "ruff>=0.7,<1",
]

[project.scripts]
lt = "live_trading.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/live_trading"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
# crypto/ + vendor/ = kode warisan Tencent. idx616/ (mesin kanonik IDX 616) dikecualikan
# sementara dari lint karena membawa format legacy (semicolon, non-PEP8) hingga sprint IDX.
# Lint berlaku untuk kode aktif saja (src/, tests/).
extend-exclude = ["crypto", "vendor", "idx616", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# tv_feed.py = skrip warisan yang dipanggil sebagai subprocess (bukan API kita).
per-file-ignores = { "src/live_trading/collectors/tv_feed.py" = ["UP031", "UP041"] }
