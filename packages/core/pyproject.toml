[project]
name = "warroom-core"
version = "0.1.0"
description = "Façade ke domain live-trading (tanpa salinan kode) + modul lintas-layanan"
requires-python = ">=3.12"
dependencies = ["live-trading"]

[tool.uv.sources]
live-trading = { path = "../../../live-trading", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warroom_core"]