[project]
name = "warroom-core"
version = "0.1.0"
description = "Façade ke domain live-trading (tanpa salinan kode) + gate service + skema data platform"
requires-python = ">=3.12"
dependencies = [
    "live-trading",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
]

[tool.uv.sources]
live-trading = { path = "../../../live-trading", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warroom_core"]