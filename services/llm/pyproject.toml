[project]
name = "warroom-llm"
version = "0.1.0"
description = "War Room LLM gateway — nutaraline (utama) → qonek (fallback), circuit breaker, cache, audit"
requires-python = ">=3.12"
dependencies = ["warroom-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warroom_llm"]