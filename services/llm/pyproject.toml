[project]
name = "warroom-llm"
version = "0.1.0"
description = "War Room LLM gateway — nutaraline (utama) → qonek (fallback), circuit breaker, cache, audit"
requires-python = ">=3.12"
dependencies = [
    "warroom-core",
    "httpx>=0.28.1,<1",
    "pydantic>=2.9,<3",
    "sqlalchemy>=2.0,<3",
]

[tool.uv.sources]
warroom-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warroom_llm"]