[project]
name = "warroom-worker"
version = "0.1.0"
description = "War Room worker — job runner (snapshot, collect, replay, learner, parity-drift, reconcile, freshness, backup)"
requires-python = ">=3.12"
dependencies = [
    "warroom-core",
    "warroom-notifier",
    "live-trading",
    "sqlalchemy>=2.0,<3",
]

[tool.uv.sources]
warroom-core = { workspace = true }
warroom-notifier = { workspace = true }
live-trading = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warroom_worker"]