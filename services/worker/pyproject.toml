[project]
name = "warroom-worker"
version = "0.1.0"
description = "War Room worker — job runner (snapshot, collect, replay, learner, parity-drift, reconcile, freshness, backup)"
requires-python = ">=3.12"
dependencies = ["warroom-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warroom_worker"]