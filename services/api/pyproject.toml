[project]
name = "warroom-api"
version = "0.1.0"
description = "War Room API — REST /api/v1/*, SSE, auth/RBAC (FastAPI)"
requires-python = ">=3.12"
dependencies = ["warroom-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warroom_api"]